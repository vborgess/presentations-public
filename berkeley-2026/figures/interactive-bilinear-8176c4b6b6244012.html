    .delta-control label { font-size:24px; color:#647185; }
    .controls { width:84%; margin:0 auto; }
    .control-row { display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:center; margin:7px 0; }
    .control-row label { font-size:22px; color:var(--accent); }
    input[type=range] { appearance:none; -webkit-appearance:none; width:100%; height:32px; margin:0; background:transparent; cursor:ew-resize; touch-action:pan-y; accent-color:var(--accent,#647185); }
    input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:var(--track,#dce1e6); }
    input[type=range]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:19px; height:19px; margin-top:-7.5px; border:2px solid white; border-radius:50%; background:var(--accent,#647185); box-shadow:0 0 0 1px var(--accent,#647185); }

    button { padding:3px 0; border:0; border-bottom:1px solid #c9d1d9; color:#647185; background:white; font:inherit; font-size:13px; cursor:pointer; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }

<script>
/* Approved variant C. Same parabola/normal convention and delta scaling as
   interactive-wave-packets. Only the central pair has tinted interiors;
   their gold region is an exact convex-polygon intersection. */
"use strict";
(function () {
  const MIN = -1.15, MAX = 1.15, DELTA_MIN = 0.16, DELTA_MAX = 0.28;
  const INITIAL = [1, -1, 0.20];
  const add = (a,b) => [a[0]+b[0], a[1]+b[1]];
  const scale = (p,s) => [p[0]*s,p[1]*s];
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1];
  const cross = (a,b,p) => (b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
  const clamp = (x,lo,hi,fallback) => Number.isFinite(Number(x)) ? Math.max(lo,Math.min(hi,Number(x))) : fallback;
  const screen = p => [100*p[0], 800-100*p[1]];
  const frame = xi => {
    const z = Math.hypot(1,2*xi);
    return {normal:[-2*xi/z,1/z],tangent:[1/z,2*xi/z]};
  };
  const P = xi => [6+3.4*xi,1.65+3.4*xi*xi];
  const sample = (lo,hi,count,fn) => Array.from({length:count+1},(_,i)=>fn(lo+(hi-lo)*i/count));
  const curve = sample(-1.3,1.3,240,P);
  const signedArea = poly => poly.reduce((s,a,i) => {
    const b=poly[(i+1)%poly.length]; return s+a[0]*b[1]-a[1]*b[0];
  },0)/2;
  const area = poly => Math.abs(signedArea(poly));

  function intersection(subject, boundary) {
    // Sutherland-Hodgman clipping works at parallel and coincident edges too;
    // there is no division by sin(angle) or artificial area enlargement.
    let result = subject.map(p=>p.slice());
    const clip = signedArea(boundary)<0 ? boundary.slice().reverse() : boundary;
    for (let i=0; i<clip.length && result.length; i++) {
      const a=clip[i], b=clip[(i+1)%clip.length], output=[];
      for (let j=0;j<result.length;j++) {
        const p=result[j],q=result[(j+1)%result.length];
        const cp=cross(a,b,p),cq=cross(a,b,q);
        const insideP=cp>=-1e-10,insideQ=cq>=-1e-10;
        if (insideP) output.push(p);
        if (insideP!==insideQ) {
          const t=Math.max(0,Math.min(1,cp/(cp-cq)));
          output.push(add(p,scale(add(q,scale(p,-1)),t)));
        }
      }
      result=output.filter((p,j)=> j===0 || Math.hypot(p[0]-output[j-1][0],p[1]-output[j-1][1])>1e-9);
      if (result.length>1 && Math.hypot(result[0][0]-result.at(-1)[0],result[0][1]-result.at(-1)[1])<1e-9) result.pop();
    }
    return result;
  }

  function rectangle(normal,tangent,length,width) {
    return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>
      add([6,3.7],add(scale(normal,a*length/2),scale(tangent,b*width/2))));
  }

  function packet(xi,delta,index) {
    const ratio=delta/0.20, length=4.4/(ratio*ratio), width=0.88/ratio;
    const {normal,tangent}=frame(xi), center=P(xi);
    const xs=sample(xi-0.1*ratio,xi+0.1*ratio,80,x=>x);
    const radius=0.09, lo=xs[0],hi=xs.at(-1);
    const shade=xs.map(x=>add(P(x),scale(frame(x).normal,radius)));
    for(let i=1;i<=48;i++) {
      const a=Math.PI*i/48,f=frame(hi);
      shade.push(add(P(hi),scale(add(scale(f.normal,Math.cos(a)),scale(f.tangent,Math.sin(a))),radius)));
    }
    shade.push(...xs.slice().reverse().map(x=>add(P(x),scale(frame(x).normal,-radius))));
    for(let i=1;i<=48;i++) {
      const a=Math.PI*i/48,f=frame(lo);
      shade.push(add(P(lo),scale(add(scale(f.normal,Math.cos(a)),scale(f.tangent,Math.sin(a))),-radius)));
    }
    const tip=add(center,scale(normal,3.4*Math.hypot(0.3,0.15)));
    return {xi,delta,length,width,normal,tangent,center,tip,shade,arc:xs.map(P),
      polygon:rectangle(normal,tangent,length,width),
      matrix:[normal[0],-normal[1],tangent[0],-tangent[1],600,430],
      projection:[[center[0],1.65],center],
      normalLabel:add(tip,add(scale(normal,0.18),scale(tangent,index===0?0.30:-0.30)))};
  }

  function geometry(first=1,second=-1,scaleValue=0.20) {
    const xi1=clamp(first,MIN,MAX,INITIAL[0]),xi2=clamp(second,MIN,MAX,INITIAL[1]);
    const delta=clamp(scaleValue,DELTA_MIN,DELTA_MAX,INITIAL[2]);
    const packets=[packet(xi1,delta,0),packet(xi2,delta,1)];
    const overlap=intersection(packets[0].polygon,packets[1].polygon);
    const cosine=Math.min(1,Math.abs(dot(packets[0].normal,packets[1].normal)));
    const angle=Math.acos(cosine);
    return {xi1,xi2,delta,packets,overlap,area:area(overlap),angle,curve};
  }

  function gridPath(length,width) {
    // Each shared lattice edge is drawn once. Overscan covers all controls.
    const x0=-6.5*length*100,x1=6.5*length*100,y0=-14.5*width*100,y1=14.5*width*100;
    const lines=[];
    for(let k=-6;k<=7;k++) { const x=(k-0.5)*length*100; lines.push(`M ${x} ${y0} V ${y1}`); }
    for(let j=-14;j<=15;j++) { const y=(j-0.5)*width*100; lines.push(`M ${x0} ${y} H ${x1}`); }
    return lines.join(' ');
  }

  function mount(root) {
    const el=id=>root.querySelector('#'+id);
    const svgPath=points=>points.map((p,i)=>`${i?'L':'M'} ${screen(p).map(v=>v.toFixed(5)).join(' ')}`).join(' ');
    const path=(id,points,closed=false)=>el(id).setAttribute('d',svgPath(points)+(closed?' Z':''));
    const polygon=(id,points)=>el(id).setAttribute('points',points.map(p=>screen(p).map(v=>v.toFixed(5)).join(',')).join(' '));
    const label=(id,p)=>{const [x,y]=screen(p);el(id).setAttribute('x',x);el(id).setAttribute('y',y);};
    const controls=[null,el('xi2-slider'),null];
    let current=INITIAL.slice();
    function render(a,b,d) {
      const state=geometry(1,b,0.20);current=[state.xi1,state.xi2,state.delta];
      const closeLabels=Math.abs(state.xi1-state.xi2)<0.18;
      state.packets.forEach((p,i)=>{
        const n=i+1;
        el(`grid-${n}`).setAttribute('d',gridPath(p.length,p.width));
        el(`grid-${n}`).setAttribute('transform',`matrix(${p.matrix.join(' ')})`);
        for(const prefix of ['clearance','packet-fill','packet-border']) polygon(`${prefix}-${n}`,p.polygon);
        path(`shade-${n}`,p.shade,true);path(`arc-${n}`,p.arc);
        path(`normal-${n}`,[p.center,p.tip]);path(`projection-${n}`,p.projection);
        label(`normal-label-${n}`,p.normalLabel);
        label(`center-label-${n}`,[p.center[0],closeLabels?(i===0?0.78:0.22):0.65]);
        if (controls[i]) controls[i].value=String(p.xi);
        if (controls[i]) controls[i].setAttribute('aria-valuetext',`xi ${n} equals ${p.xi.toFixed(2)}`);
      });
      polygon('intersection',state.overlap);
      // When borders coincide, a narrow gold line over a wider blue line keeps
      // both packet identities visible without moving their boundaries.
      const coincidence=Math.max(0,1-state.angle/0.04);
      el('packet-border-1').setAttribute('stroke-width',4+3*coincidence);
      el('packet-border-2').setAttribute('stroke-width',4-1*coincidence);
      Object.assign(root.dataset,{xi1:String(state.xi1),xi2:String(state.xi2),delta:String(state.delta),overlapArea:String(state.area)});
      el('packet-description').textContent=`Two highlighted packets through the origin, with a gold intersection. Other packets form a faint gray lattice. The acute angle is ${(state.angle*180/Math.PI).toFixed(1)} degrees.`;
      return state;
    }
    path('parabola',curve);
    const setXi1=value=>render(value,current[1],current[2]);
    const setXi2=value=>render(current[0],value,current[2]);
    const setDelta=value=>render(current[0],current[1],value);
    for(const [i,handler] of [[1,setXi2]]) {
      controls[i].addEventListener('input',()=>handler(controls[i].value));
      controls[i].addEventListener('keydown',event=>{
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(event.key)) event.stopPropagation();
      });
    }
    el('reset').addEventListener('click',()=>{render(...INITIAL);controls[1].focus();});
    render(...INITIAL);
    return {setXi1,setXi2,setDelta,setState:render,getState:()=>geometry(...current)};
  }
  if(typeof module!=='undefined') module.exports={geometry,intersection,area,rectangle,mount};
  if(typeof window!=='undefined') window.bilinearWavePacketGeometry=geometry;
  if(typeof document!=='undefined' && document.querySelector('#wave-packets'))
    window.bilinearWavePacketFigure=mount(document.querySelector('#wave-packets'));
}());

</script>
<script>
document.addEventListener('keydown', event => {
  if (event.target.closest('input,button,select,textarea')) return;
  if (['ArrowRight','ArrowLeft','Home','End',' ','f','F','r','R','h','H','p','P','d','D','Escape'].includes(event.key)) {
    event.preventDefault();
    parent.postMessage({type:'wave-packet-navigation',key:event.key}, '*');
  }
});
</script></body>
</html>
