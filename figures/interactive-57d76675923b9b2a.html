<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Wave packets · interactive figure</title>
  <style>
    :root { color-scheme: light; font-family: "Source Sans Pro", "Helvetica Neue", Arial, sans-serif; color: #1c2025; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1440px; margin: 0 auto; padding: clamp(24px, 4vw, 60px) clamp(16px, 3.5vw, 50px); }
    h1 { margin: 0 0 30px; color: #004a99; font-weight: 400; font-size: clamp(28px, 3.5vw, 46px); }
    .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; padding-right: 68px; }
    figure { margin: 0; min-width: 0; }
    svg { width: 100%; height: auto; display: block; overflow: visible; }
    svg text { font-family: "STIX Two Math", "Latin Modern Math", "Times New Roman", serif; font-style: italic; font-size: 38px; text-anchor: middle; fill: #5a6879; }
    svg .axis-label { font-size: 34px; fill: #647185; paint-order: stroke fill; stroke: #fff; stroke-opacity: .85; stroke-width: 5px; stroke-linejoin: round; }
    svg .dimension-label { font-size: 40px; paint-order: stroke fill; stroke: #fff; stroke-opacity: .85; stroke-width: 5px; stroke-linejoin: round; }
    svg .normal-label { fill: #c18435; }
    svg path, svg line, svg polyline { stroke-linecap: round; stroke-linejoin: round; }
    .controls { margin: 0 auto; width: 84%; }
    .control-heading { display: flex; justify-content: flex-end; align-items: baseline; margin-bottom: 12px; }
    label { color: #647185; font-size: 16px; }
    .math { font-family: "STIX Two Math", "Latin Modern Math", "Times New Roman", serif; font-style: italic; }
    .control-symbol { font-size: 21px; color: #a26a24; }
    input[type="range"] { appearance: none; -webkit-appearance: none; width: 100%; height: 32px; margin: 0; background: transparent; cursor: ew-resize; touch-action: pan-y; accent-color: #c18435; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: #e6d9c8; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 19px; height: 19px; margin-top: -7.5px; border: 2px solid #fff; border-radius: 50%; background: #c18435; box-shadow: 0 0 0 1px #c18435; }
    input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: #e6d9c8; }
    input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border: 2px solid #fff; border-radius: 50%; background: #c18435; box-shadow: 0 0 0 1px #c18435; }
    input[type="range"]:focus-visible { outline: 2px solid #00629b; outline-offset: 5px; border-radius: 8px; }
    .frequency-row { position: relative; }
    .delta-control { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); width: 58px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .delta-control label { font-size: 23px; color: #a26a24; }
    input[type="range"].vertical { writing-mode: vertical-lr; direction: rtl; width: 32px; height: clamp(120px, 18vw, 230px); cursor: ns-resize; touch-action: pan-x; }
    input[type="range"].vertical::-webkit-slider-runnable-track { width: 4px; height: 100%; }
    input[type="range"].vertical::-webkit-slider-thumb { margin-top: 0; margin-left: -7.5px; }
    input[type="range"].vertical::-moz-range-track { width: 4px; height: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .footer { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; gap: 12px; }
    .hint { margin: 0; color: #8695a6; font-size: 13px; }
    button { border: 0; border-bottom: 1px solid #c9d1d9; padding: 3px 0; color: #647185; background: transparent; font: inherit; font-size: 13px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #00629b; outline-offset: 4px; }
    noscript p { color: #a26a24; }
    @media (max-width: 620px) {
      main { padding: 24px 12px; }
      h1 { margin-left: 12px; margin-bottom: 12px; }
      .figures { grid-template-columns: 1fr; gap: 8px; }
      .controls { margin-bottom: 20px; }
    }
  </style>
<style>/* Fixed 16:10 slide canvas: never stack the physical and frequency panels. */
html, body { margin: 0; width: 1440px; height: 430px; overflow: hidden; background: white; }
#wave-packets { width: 1440px; height: 430px; max-width: none; padding: 0; position: relative; }
#wave-packets h1 { display: none; }
#wave-packets .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0; }
#wave-packets .figures > figure > svg,
#wave-packets .frequency-row { width: 560px; margin: 0 auto; }
#wave-packets .controls { width: 500px; margin: 0 auto; }
#wave-packets .control-heading { height: 28px; line-height: 28px; margin-bottom: 0; }
#wave-packets #xi-slider { display: block; height: 26px; }
#wave-packets .control-heading label { font-size: 20px; }
#wave-packets .control-symbol { font-size: 25px; }
#wave-packets .delta-control { gap: 7px; }
#wave-packets .delta-control label { font-size: 27px; }
#wave-packets input[type="range"].vertical { height: 200px; }
#wave-packets .footer { position: absolute; left: 70px; bottom: 10px; margin: 0; }
#wave-packets .footer .hint { display: none; }
#wave-packets #reset { font-size: 17px; }
</style></head>
<body>
<main id="wave-packets">
  <h1>Wave packets</h1>
  <div class="figures">
    <figure aria-label="Wave packets in physical space">
      <svg id="packet-figure" viewBox="0 0 1200 800" role="img" aria-labelledby="packet-title packet-description">
        <title id="packet-title">Wave packets in physical space</title>
        <desc id="packet-description">Equal rectangular packets tile the plane. Their long sides follow the normal to the selected support on the parabola. Decreasing delta increases their length like delta to the minus two and their width like delta to the minus one.</desc>
        <defs>
          <clipPath id="packet-clip"><rect x="70" y="115" width="1060" height="620"/></clipPath>
          <linearGradient id="fade-left"><stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
          <linearGradient id="fade-right" x1="1" x2="0"><stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
          <linearGradient id="fade-top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
          <linearGradient id="fade-bottom" x1="0" y1="1" x2="0" y2="0"><stop stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
          <marker id="physical-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto"><path d="M 0 0 L 12 4.5 L 0 9 L 3 4.5 Z" fill="#a6b3c0"/></marker>
        </defs>
        <g clip-path="url(#packet-clip)">
          <g id="packet-grid" fill="#e8f1f6" stroke="#a6c8dc" stroke-width="1.2"></g>
          <g fill="white" pointer-events="none">
            <rect x="70" y="115" width="100" height="620" fill="url(#fade-left)"/>
            <rect x="1030" y="115" width="100" height="620" fill="url(#fade-right)"/>
            <rect x="70" y="115" width="1060" height="100" fill="url(#fade-top)"/>
            <rect x="70" y="635" width="1060" height="100" fill="url(#fade-bottom)"/>
          </g>
        </g>
        <g stroke="#a6b3c0" stroke-width="1.2" marker-end="url(#physical-arrow)">
          <path d="M 90 430 H 1110"/>
          <path d="M 600 720 V 130"/>
        </g>
        <text class="axis-label" x="1075" y="412">x</text>
        <text class="axis-label" x="622" y="160">t</text>
        <g id="packet-brackets" fill="none" stroke="#5a6879" stroke-width="1.8">
          <path id="packet-length-bracket"/>
          <path id="packet-width-bracket"/>
        </g>
        <text id="packet-length" class="dimension-label">δ<tspan baseline-shift="super" font-size="25" font-style="normal">−2</tspan></text>
        <text id="packet-width" class="dimension-label">δ<tspan baseline-shift="super" font-size="25" font-style="normal">−1</tspan></text>
      </svg>
    </figure>
    <figure aria-label="Support on the parabola in frequency space">
      <div class="frequency-row">
      <svg id="frequency-figure" viewBox="0 0 1200 800" role="img" aria-labelledby="frequency-title frequency-description">
        <title id="frequency-title">Support on the parabola</title>
        <desc id="frequency-description">A rounded highlighted support lies on tau equals xi squared. The horizontal slider moves its center and normal. The vertical slider changes its length at scale delta while the decorative highlight keeps a fixed thickness.</desc>
        <defs>
          <marker id="frequency-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto"><path d="M 0 0 L 12 4.5 L 0 9 L 3 4.5 Z" fill="#c2c9d1"/></marker>
          <marker id="normal-arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto"><path d="M 0 0 L 16 6 L 0 12 L 4.5 6 Z" fill="#c18435"/></marker>
        </defs>
        <g stroke="#c2c9d1" stroke-width="1.2" marker-end="url(#frequency-arrow)">
          <path d="M 90 635 H 1110"/>
          <path d="M 600 740 V 20"/>
        </g>
        <text class="axis-label" x="1130" y="642">ξ</text>
        <text class="axis-label" x="627" y="33">τ</text>
        <path id="frequency-projection" stroke="#9da8b5" stroke-width="1.4" stroke-dasharray="9 7.5"/>
        <text id="frequency-center" class="axis-label">ξ<tspan baseline-shift="sub" font-size="23" font-style="normal">0</tspan></text>
        <path id="parabola" fill="none" stroke="#1c2025" stroke-width="2.5"/>
        <path id="support-shade" fill="#f0e1cf"/>
        <path id="support-arc" fill="none" stroke="#c18435" stroke-width="3.8"/>
        <path id="support-normal" stroke="#c18435" stroke-width="2.9" marker-end="url(#normal-arrow)"/>
        <text id="normal-label" class="normal-label">n</text>
        <g fill="none" stroke="#5a6879" stroke-width="1.6">
          <path id="support-length-bracket"/>
        </g>
        <text id="support-length" class="dimension-label">δ</text>
      </svg>
      <div class="delta-control">
        <label for="delta-slider" class="math">δ</label>
        <input id="delta-slider" class="vertical" type="range" min="0.16" max="0.28" step="0.001" value="0.20" aria-label="Scale delta" aria-orientation="vertical" aria-describedby="delta-help">
        <span id="delta-help" class="sr-only">Move down, or press Down Arrow, for smaller delta and longer packets. Move up for larger delta and shorter packets.</span>
      </div>
      </div>
      <div class="controls">
        <div class="control-heading">
          <span id="xi-output" class="math control-symbol">ξ<sub>0</sub></span>
        </div>
        <input id="xi-slider" type="range" min="-1.15" max="1.15" step="0.01" value="1" aria-label="Center of the support, xi zero" aria-describedby="slider-help">
        <div class="footer"><p class="hint" id="slider-help">Drag, or use the left and right arrow keys.</p><button id="reset" type="button">Reset</button></div>
      </div>
    </figure>
  </div>
  <noscript><p>Enable JavaScript to move and scale the support and its wave packets.</p></noscript>
</main>
<script>
/* Interactive prototype adapted from the approved A2/B3 vector figures.
   Mathematical coordinates: tau = xi^2, n = (-2 xi, 1)/sqrt(1+4 xi^2).
   The cap length varies with delta; its decorative halo has fixed thickness.
   Packet scales remain delta^-1 and delta^-2.
   Changing xi alone still rotates without rescaling. */
"use strict";
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const MIN = -1.15, MAX = 1.15, INITIAL = 1;
  const DELTA_MIN = 0.16, DELTA_MAX = 0.28, DELTA_INITIAL = 0.20;
  const LENGTH = 4.4, WIDTH = 0.88, RADIUS = 0.09;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const scale = (a, t) => [a[0] * t, a[1] * t];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  // Extra room below the vertex keeps the scale and xi_0 labels separate.
  const P = x => [6 + 3.4 * x, 1.65 + 3.4 * x * x];
  const screen = p => [100 * p[0], 800 - 100 * p[1]];
  const frame = x => {
    const z = Math.hypot(1, 2 * x);
    return { tangent: [1 / z, 2 * x / z], normal: [-2 * x / z, 1 / z] };
  };
  const sample = (lo, hi, count, fn) => Array.from({ length: count + 1 }, (_, i) => fn(lo + (hi - lo) * i / count));
  const curve = sample(-1.3, 1.3, 240, P);

  function geometry(value, deltaValue = DELTA_INITIAL) {
    const numeric = Number(value);
    const xi = Number.isFinite(numeric) ? Math.max(MIN, Math.min(MAX, numeric)) : INITIAL;
    const numericDelta = Number(deltaValue);
    const delta = Number.isFinite(numericDelta) ? Math.max(DELTA_MIN, Math.min(DELTA_MAX, numericDelta)) : DELTA_INITIAL;
    const ratio = delta / DELTA_INITIAL;
    const radius = RADIUS;
    const packetLength = LENGTH / (ratio * ratio), packetWidth = WIDTH / ratio;
    const halfLength = packetLength / 2, halfWidth = packetWidth / 2;
    const center = P(xi), { tangent, normal } = frame(xi);
    const q = (a, b) => add([6, 3.7], add(scale(normal, a), scale(tangent, b)));
    const f = (u, v) => add(center, add(scale(tangent, u), scale(normal, v)));
    const lo = xi - 0.1 * ratio, hi = xi + 0.1 * ratio;
    const xs = sample(lo, hi, 80, x => x);
    const shade = xs.map(x => add(P(x), scale(frame(x).normal, radius)));
    // Semicircular caps meet both sides of the curved support tangentially.
    for (let i = 1; i <= 48; i++) {
      const angle = Math.PI * i / 48, end = frame(hi);
      shade.push(add(P(hi), scale(add(scale(end.normal, Math.cos(angle)), scale(end.tangent, Math.sin(angle))), radius)));
    }
    shade.push(...xs.slice().reverse().map(x => add(P(x), scale(frame(x).normal, -radius))));
    for (let i = 1; i <= 48; i++) {
      const angle = Math.PI * i / 48, start = frame(lo);
      shade.push(add(P(lo), scale(add(scale(start.normal, Math.cos(angle)), scale(start.tangent, Math.sin(angle))), -radius)));
    }
    const relative = shade.map(p => add(p, scale(center, -1)));
    const us = relative.map(p => dot(p, tangent)), vs = relative.map(p => dot(p, normal));
    const umin = Math.min(...us), umax = Math.max(...us), vmin = Math.min(...vs);
    const tip = add(center, scale(normal, 3.4 * Math.hypot(0.3, 0.15)));
    const bracketV = vmin - 0.21, tickV = vmin - 0.10, labelV = vmin - 0.50;
    // Width can be measured anywhere along a rectangular packet. Move its
    // bracket inward for long packets so that it remains in the visible field.
    const widthAt = Math.min(halfLength + 0.23, 2.43);
    return {
      xi, delta, radius, center, tangent, normal, curve, shade,
      arc: xs.map(P), tip,
      normalLabel: add(tip, add(scale(normal, 0.12), scale(tangent, 0.18))),
      projection: [[center[0], 1.65], center],
      xiLabel: [center[0], 0.65],
      // The linear part of this screen-space matrix is orthogonal: no scaling.
      packetMatrix: [normal[0], -normal[1], tangent[0], -tangent[1], 600, 430],
      packetLengthBracket: [q(-halfLength, halfWidth + 0.12), q(-halfLength, halfWidth + 0.24), q(halfLength, halfWidth + 0.24), q(halfLength, halfWidth + 0.12)],
      packetWidthBracket: [q(-widthAt + 0.13, -halfWidth), q(-widthAt, -halfWidth), q(-widthAt, halfWidth), q(-widthAt + 0.13, halfWidth)],
      packetLengthLabel: q(0, halfWidth + 0.52),
      packetWidthLabel: q(-widthAt - 0.51, -0.04),
      supportLengthBracket: [f(umin, tickV), f(umin, bracketV), f(umax, bracketV), f(umax, tickV)],
      supportLengthLabel: f(0.02, labelV),
      packetLength, packetWidth
    };
  }

  function mount(root) {
    const el = id => root.querySelector(`#${id}`);
    const svgPath = points => points.map((p, i) => `${i ? "L" : "M"} ${screen(p).map(v => v.toFixed(4)).join(" ")}`).join(" ");
    const path = (id, points, closed = false) => el(id).setAttribute("d", svgPath(points) + (closed ? " Z" : ""));
    const label = (id, p) => { const [x, y] = screen(p); el(id).setAttribute("x", x); el(id).setAttribute("y", y); };
    const slider = el("xi-slider");
    const deltaSlider = el("delta-slider");
    let currentXi = INITIAL, currentDelta = DELTA_INITIAL;
    // Overscan exceeds the clip's diagonal at every rotation. Interior tiles
    // share boundaries exactly and all have the same style.
    const grid = el("packet-grid");
    const tiles = [];
    for (let j = -12; j <= 12; j++) {
      for (let k = -3; k <= 3; k++) {
        const tile = document.createElementNS(NS, "rect");
        tiles.push({ tile, j, k });
        grid.appendChild(tile);
      }
    }
    path("parabola", curve);

    function render(value, deltaValue) {
      const state = geometry(value, deltaValue);
      currentXi = state.xi;
      currentDelta = state.delta;
      const matrix = `matrix(${state.packetMatrix.join(" ")})`;
      grid.setAttribute("transform", matrix);
      for (const { tile, j, k } of tiles) {
        tile.setAttribute("x", (k - 0.5) * state.packetLength * 100);
        tile.setAttribute("y", (j - 0.5) * state.packetWidth * 100);
        tile.setAttribute("width", state.packetLength * 100);
        tile.setAttribute("height", state.packetWidth * 100);
      }
      path("packet-length-bracket", state.packetLengthBracket);
      path("packet-width-bracket", state.packetWidthBracket);
      path("support-shade", state.shade, true);
      path("support-arc", state.arc);
      path("support-normal", [state.center, state.tip]);
      path("frequency-projection", state.projection);
      path("support-length-bracket", state.supportLengthBracket);
      label("normal-label", state.normalLabel);
      label("frequency-center", state.xiLabel);
      label("packet-length", state.packetLengthLabel);
      label("packet-width", state.packetWidthLabel);
      label("support-length", state.supportLengthLabel);
      slider.value = state.xi;
      deltaSlider.value = state.delta;
      slider.setAttribute("aria-valuetext", `xi zero equals ${state.xi.toFixed(2)}`);
      deltaSlider.setAttribute("aria-valuetext", `delta equals ${state.delta.toFixed(3)}; down makes delta smaller and packets longer`);
      root.dataset.xi = String(state.xi);
      root.dataset.delta = String(state.delta);
      return state;
    }
    const setXi = value => render(value, currentDelta);
    const setDelta = value => render(currentXi, value);
    slider.addEventListener("input", () => setXi(slider.value));
    deltaSlider.addEventListener("input", () => setDelta(deltaSlider.value));
    // Keep native range behavior; prevent later slide-player shortcuts from
    // consuming arrows, Home, End, PageUp and PageDown while the control is used.
    for (const control of [slider, deltaSlider]) {
      control.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"].includes(event.key)) event.stopPropagation();
      });
    }
    el("reset").addEventListener("click", () => { render(INITIAL, DELTA_INITIAL); slider.focus(); });
    render(INITIAL, DELTA_INITIAL);
    return { setXi, setDelta, geometry };
  }
  // A small integration seam and a DOM-independent numerical test seam.
  if (typeof module !== "undefined") module.exports = { geometry, mount };
  if (typeof window !== "undefined") window.wavePacketGeometry = geometry;
  if (typeof document !== "undefined" && document.querySelector("#wave-packets")) {
    window.wavePacketFigure = mount(document.querySelector("#wave-packets"));
  }
}());

</script>
<script>
document.addEventListener('keydown', event => {
  if (event.target.closest('input,button,select,textarea')) return;
  if (['ArrowRight','ArrowLeft','Home','End',' ','f','F','r','R','h','H','p','P','d','D','Escape'].includes(event.key)) {
    event.preventDefault();
    parent.postMessage({type:'wave-packet-navigation',key:event.key}, '*');
  }
});
</script></body>
</html>
