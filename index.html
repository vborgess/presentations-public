<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Presentations</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #202a36; font: 17px/1.6 system-ui, -apple-system, sans-serif; }
    main { max-width: 760px; margin: 12vh auto; padding: 0 24px; }
    h1 { margin: 0 0 8px; color: #004a99; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.2; }
    p { margin: 0 0 36px; color: #596575; }
    ul { list-style: none; margin: 0; padding: 0; }
    a { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
        padding: 24px; border: 1px solid #d5deea; border-left: 4px solid #004a99; border-radius: 6px;
        background: white; color: #004a99; text-decoration: none; }
    a:hover { border-color: #004a99; background: #f0f6ff; }
    a:focus-visible { outline: 3px solid #0067c0; outline-offset: 5px; }
    .talk { font-size: 1.3rem; font-weight: 650; }
    .open { font-size: .95rem; text-decoration: underline; text-underline-offset: .2em; }
    @media (max-width: 480px) { main { margin-top: 8vh; } a { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>Presentations</h1>
    <p>Research talks.</p>
    <nav aria-label="Presentations">
      <ul>
        <li><a href="./berkeley-2026/"><span class="talk">Berkeley 2026</span><span class="open">Open presentation <span aria-hidden="true">→</span></span></a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
